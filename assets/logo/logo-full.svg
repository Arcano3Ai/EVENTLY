<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="evently-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="evently-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Outer rounded hexagon container -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <rect x="2" y="2" width="56" height="56" rx="14" fill="url(#evently-grad-primary)" opacity="0.15" />
    
    <!-- Stylized dynamic 'E' prism -->
    <path d="M18 16 H42 C44.2 16 46 17.8 46 20 V22 C46 24.2 44.2 26 42 26 H26 V29 H38 C40.2 29 42 30.8 42 33 V35 C42 37.2 40.2 39 38 39 H26 V42 H42 C44.2 42 46 43.8 46 46 V48 C46 50.2 44.2 52 42 52 H18 C15.8 52 14 50.2 14 48 V20 C14 17.8 15.8 16 18 16 Z" 
          fill="url(#evently-grad-primary)" filter="url(#glow)"/>
    <circle cx="43" cy="18" r="3" fill="#38bdf8" />
    <circle cx="43" cy="50" r="3" fill="#ec4899" />
  </g>

  <!-- Typography -->
  <text x="84" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="2.5" fill="#ffffff">EVENTLY</text>
  <text x="85" y="61" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#94a3b8">EVENT OPERATIONS OS</text>
  
  <!-- Subtle decorative dot -->
  <circle cx="282" cy="38" r="3.5" fill="#10b981" />
</svg>
